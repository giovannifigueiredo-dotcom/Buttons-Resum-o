<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .tech-btn {
    position: relative;
    padding: 16px 48px;
    background-color: rgba(20, 20, 22, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.3s ease, transform 0.1s ease;
    backdrop-filter: blur(10px);
  }

  .tech-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(
      circle 70px at var(--x) var(--y), 
      rgba(0, 212, 255, 0.4), 
      transparent 100%
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none; 
  }

  .tech-btn:hover::before {
    opacity: 1;
  }

  .tech-btn:hover {
    border-color: rgba(0, 212, 255, 0.5);
  }

  .tech-btn:active {
    transform: scale(0.98);
  }

  .btn-text {
    position: relative;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- O Botão (Cole o seu link no lugar indicado abaixo) -->
  <button class="tech-btn" onclick="window.top.location.href='https://sites.google.com/view/seusite/sua-pagina'">
    <span class="btn-text">Ir para a aba</span>
  </button>

  <script>
    const button = document.querySelector('.tech-btn');

    button.addEventListener('mousemove', (e) => {
      const rect = button.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      button.style.setProperty('--x', `${x}px`);
      button.style.setProperty('--y', `${y}px`);
    });
  </script>

</body>
</html>
